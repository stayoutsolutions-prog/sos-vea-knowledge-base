        matrix: document.getElementById('view-matrix-btn'),
        vetting: document.getElementById('view-vetting-btn'),
        rates: document.getElementById('view-rates-btn')
      };

      const navHeader = document.getElementById('nav-header');

      Object.keys(buttons).forEach(k => {
        if (buttons[k]) {
          buttons[k].className = (k === view) 
            ? "px-3.5 py-2 rounded-lg text-white bg-[#023137] shadow-sm transition-all whitespace-nowrap font-bold" 
            : "px-3.5 py-2 rounded-lg text-slate-700 hover:text-[#023137] hover:bg-slate-200 transition-all whitespace-nowrap font-semibold";
        }
      });

      if (view === 'sheets') {
        navHeader.innerText = "Workbook Sheets (v4.2)";
        activeItemId = 'tab-01';
      } else if (view === 'drive') {
        navHeader.innerText = "Google Drive Repositories";
        activeItemId = 'drive-root';
      } else if (view === 'matrix') {
        navHeader.innerText = "Document Matrix (20 Files)";
        activeItemId = 'matrix-all';
      } else if (view === 'vetting') {
        navHeader.innerText = "5-Step Vetting Lifecycle";
        activeItemId = 'vetting-overview';
      } else if (view === 'rates') {
        navHeader.innerText = "Financials & Wise Payouts";
        activeItemId = 'rates-overview';
      }

      renderNavItems();
      renderContent();
    }

    function renderNavItems(filter = '') {
      const container = document.getElementById('nav-items-container');
      
      if (currentMainView === 'sheets') {
        const filtered = workbookData.filter(item => {
          const text = `${item.num} ${item.title} ${item.keywords.join(' ')}`.toLowerCase();
          return text.includes(filter.toLowerCase());
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="p-3 text-xs text-slate-500 italic">No matching sheets found.</div>`;
          return;
        }

        container.innerHTML = filtered.map(item => {
          const isActive = item.id === activeItemId;
          return `
            <button 
              onclick="selectItem('${item.id}')"
              class="w-full text-left px-3.5 py-3 rounded-xl transition-all flex items-center justify-between group ${
                isActive 
                  ? 'bg-[#023137] text-white shadow-sm font-semibold' 
                  : 'bg-white hover:bg-slate-200 text-slate-700 border border-slate-200'
              }"
            >
              <div class="flex flex-col truncate">
                <span class="text-[10px] ${isActive ? 'text-teal-200' : 'text-slate-500'} uppercase tracking-wider font-bold">${item.num}</span>
                <span class="text-xs truncate ${isActive ? 'text-white' : 'text-[#023137]'} font-bold mt-0.5">${item.title}</span>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded-md ${isActive ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600 border border-slate-300'} font-medium">${item.badge}</span>
            </button>
          `;
        }).join('');
      } else if (currentMainView === 'drive') {
        container.innerHTML = driveFolders.map(folder => `
          <a 
            href="${folder.url}" 
            target="_blank"
            class="w-full text-left px-3.5 py-3 rounded-xl transition-all flex items-center justify-between group bg-white hover:bg-amber-50 border border-slate-200 hover:border-amber-400 shadow-sm"
          >
            <div class="flex flex-col truncate">
              <span class="text-[10px] text-amber-800 font-extrabold uppercase tracking-wider">${folder.num}</span>
              <span class="text-xs truncate font-bold text-[#023137] mt-0.5">${folder.name}</span>
            </div>
            <span class="text-[10px] px-2.5 py-1 rounded-md bg-amber-500/10 text-amber-900 border border-amber-500/30 font-bold">🔗 Open</span>
          </a>
        `).join('');
      } else {
        container.innerHTML = `
          <div class="p-3 text-xs text-slate-600 font-medium">
            Navigation controls active in main content panel.
          </div>
        `;
      }
    }

    function selectItem(id) {
      activeItemId = id;
      renderNavItems(document.getElementById('search-input').value);
      renderContent();
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value;
      renderNavItems(query);
    }

    switchMainView('sheets');
  </script>
