<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS VEA Recruitment Tracker - Knowledge Base & SOP Guide</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0265d2',
                            800: '#0f2c59',
                            900: '#0b1d3a',
                            gold: '#f59e0b',
                            emerald: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden bg-slate-950 text-slate-200">

    <header class="h-16 border-b border-slate-800 bg-slate-900/90 px-4 lg:px-8 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-700 to-amber-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg border border-amber-400/40">
                S
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="font-extrabold text-base lg:text-lg text-white tracking-tight">STAY OUT SOLUTIONS</h1>
                    <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 font-bold px-2 py-0.5 rounded-full">v4.2 PROD</span>
                </div>
                <p class="text-[11px] text-slate-400 font-medium">VEA Recruitment & Operational System Knowledge Base</p>
            </div>
        </div>

        <div class="flex items-center space-x-3 text-xs">
            <button onclick="setActiveTab('go-live')" class="flex items-center space-x-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl border border-emerald-500/30 transition-all font-semibold">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Go-Live Audit</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">

        <!-- Sidebar Navigation -->
        <aside class="w-80 border-r border-slate-800 bg-slate-900/50 flex flex-col shrink-0 overflow-hidden">
            
            <!-- Real-time Search Box -->
            <div class="p-4 border-b border-slate-800 space-y-2.5">
                <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Search Knowledge Base</label>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search formulas, tabs, rules..." class="w-full bg-slate-950 text-slate-100 placeholder-slate-500 text-xs pl-8 pr-8 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-sky-500 transition-all">
                    <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <button id="clearSearchBtn" class="hidden absolute right-2.5 top-2 text-slate-500 hover:text-slate-300">×</button>
                </div>

                <!-- Quick Tags -->
                <div class="flex flex-wrap gap-1 pt-1">
                    <button onclick="quickSearch('formula')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700">#formulas</button>
                    <button onclick="quickSearch('dry_run')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-300 px-2 py-0.5 rounded border border-slate-700">#dry_run</button>
                    <button onclick="quickSearch('connecteam')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-sky-300 px-2 py-0.5 rounded border border-slate-700">#bids</button>
                    <button onclick="quickSearch('stalled')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-rose-300 px-2 py-0.5 rounded border border-slate-700">#stalled</button>
                </div>
            </div>

            <!-- Tab Menu Items -->
            <nav class="flex-1 overflow-y-auto p-3 space-y-1" id="navList">
                <div class="px-2 py-1 text-[10px] font-bold tracking-wider text-slate-500 uppercase">Core Documentation</div>
                
                <button onclick="setActiveTab('overview')" data-nav-id="overview" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold transition-all bg-sky-500/20 text-sky-400 border border-sky-500/30">
                    <span class="truncate">System Overview & Rules</span>
                </button>

                <button onclick="setActiveTab('go-live')" data-nav-id="go-live" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold transition-all hover:bg-slate-800 text-emerald-400">
                    <span class="truncate">Pre-Go-Live Checklist</span>
                    <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded font-mono">AUDIT</span>
                </button>

                <div class="px-2 py-1 text-[10px] font-bold tracking-wider text-slate-500 uppercase pt-3">12 Workbook Sheet Tabs</div>

                <div id="workbookTabNavs" class="space-y-1">
                    <!-- Injected via JavaScript -->
                </div>
            </nav>
        </aside>

        <!-- Main Display Content Area -->
        <main class="flex-1 overflow-y-auto bg-slate-950 p-6 lg:p-10" id="mainContent">
            <div id="contentDisplay" class="max-w-4xl mx-auto space-y-8">
                <!-- Injected Content -->
            </div>
        </main>
    </div>

    <script>
        const workbookTabs = [
            {
                id: "readme",
                num: "01",
                title: "TOC & System Readme",
                badge: "Navigation & Index",
                purpose: "Serves as the central command hub, linking directly to every module in the workbook, presenting live applicant counts, and establishing operational governance rules for recruiters.",
                steps: [
                    "Use the quick-navigation hyperlinks at the top of the sheet to jump to specific operational sections instantly.",
                    "Review high-level applicant throughput counters before launching daily recruitment tasks.",
                    "Ensure team members follow color-coded cell standardizations (Manual vs Formula)."
                ],
                manualCells: "None (Contains index tables and hyperlinked tab titles).",
                autoCells: "All statistics summary boxes (counts active applicants, total pipeline throughput, and match ratios).",
                safeguards: [
                    "DO NOT rename tab titles in Excel/Google Sheets; Apps Script relies on exact sheet name matching.",
                    "Keep hyperlinked anchors untouched to prevent navigation breakage."
                ],
                keywords: ["readme", "toc", "navigation", "hyperlinks", "index", "overview", "system readme"]
            },
            {
                id: "pipeline",
                num: "02",
                title: "Applicant Screening & Pipeline",
                badge: "3,428 Active Formulas",
                purpose: "The primary recruitment intake engine. Parses raw assessments (typing speed, pay expectations, Q1–Q5 quiz answers), auto-calculates total screening scores, applies pass/fail gate thresholds, and tracks candidate pipeline movement.",
                steps: [
                    "Input or import raw candidate submissions into Rows starting from Row 5.",
                    "Watch Columns V to AC auto-calculate typing speed, pay rate normalization, Q1–Q5 grading, and Total Score.",
                    "Check Column AE ('Gate Result') to instantly see if the candidate passed pre-screening.",
                    "Review Column AF ('Tier Suggestion') for automated tier classification (Tier 1 vs Tier 2).",

                autoCells: "Columns V to AC (Parsed metrics, Q1–Q5 auto-score), Column AE (Gate Result), Column AF (Tier Suggestion), Column AK (48h Stall Warning), Auxiliary Columns AY:BE (Rate parsing regex & WPM extraction).",
                safeguards: [
                    "CRITICAL: Never type or paste text over Columns V to AC or AY to BE. These contain automated green-coded formulas.",
                    "Formulas are pre-dragged to Row 218. When your pipeline reaches Row 200, select Row 218 and drag formulas down to Row 1,000.",
                    "If Column AK displays 'STALLED (48h+)', check Column AU and immediately trigger follow-up."
                ],
                keywords: ["pipeline", "screening", "applicant", "wpm", "rate parsing", "typing speed", "q1", "q2", "gate result", "tier suggestion", "effective tier", "stalled candidate", "48h", "next step", "ay", "be"]
            },
            {
                id: "practical",
                num: "03",
                title: "Practical Scoring",
                badge: "1,200 Active Formulas",
                purpose: "Evaluates candidates who passed pre-screening through practical simulation tests (Inbox Management, Calendar Scheduling, Executive Communication, and Tool Proficiency). Automatically applies penalty deductions and calculates weighted final scores.",

                    "Locate candidate row (Pre-dragged down to Row 322).",
                    "Input raw component evaluation points in Columns C through Q.",
                    "Record deduction points (e.g., formatting errors, missed deadlines) in Column S.",
                    "Observe auto-calculated Weighted Base Score (Col R), Final Score (Col T), and Final Result (Col V).",
                    "If Candidate receives 'RETEST', record retest score in designated retest columns."
                ],
                manualCells: "Columns A to Q (Candidate Metadata & Raw practical task scores), Column S (Deductions).",
                autoCells: "Column R (Weighted Base Score), Column T (Final Score after deductions), Column V (Result: PASS / RETEST / REJECT).",
                safeguards: [
                    "Do not alter component weight formulas in Column R header definition.",
                    "Ensure candidate ID matches the Applicant Pipeline ID exactly to preserve cross-sheet reporting."
                ],
                keywords: ["practical scoring", "practical", "deductions", "weighted base score", "retest", "pass", "reject", "inbox management", "calendar", "row 322"]
            },
            {
                id: "bid-intake",
                num: "04",
                title: "Bid Intake (Connecteam)",
                badge: "Client Input Log",
                purpose: "Landing table for incoming client Statement of Work (SOW) bid requirements exported or synced from Connecteam, including required tools, tier demands, budget, and timezones.",

                    "Paste new client SOW requests or sync form entries starting at Row 4.",
                    "Ensure Client Name, Target Tier, Required Software Tools, and Target Hourly Budget are populated.",

                ],

                    "Ensure client name string formatting is clean (avoid trailing spaces) for smooth Bid Matcher lookups."

                keywords: ["bid intake", "connecteam", "client sow", "sow", "requirements", "budget", "tools", "sample data", "bidder"]
            },
            {

                ],
                keywords: ["bid matcher", "post-close", "c4", "composite score", "match ranking", "tool alignment", "vea lookup", "recommendation"]
            },
            {
                id: "bench-roster",
                num: "06",
                title: "Active Bench Roster",
                badge: "48 Active Formulas",
                purpose: "Tracks all vetted, active VEAs currently on the bench available for deployment. Calculates billing rates, pay floor structures, estimated monthly billing, and net gross margins based on Tier configuration.",
                steps: [
                    "Add newly passed VEAs from Practical Scoring to roster (Rows 5–16).",
                    "Assign Tier status in Column G.",
                    "Watch Columns H, I, J, K automatically populate VEA Pay Rate, Client Billing Rate, Estimated Monthly Billing, and Net Margin."
                ],
                manualCells: "Columns A to G (VEA Name, Primary Skills, Status, Assigned Tier).",
                autoCells: "Columns H to K (VEA Pay Rate, Client Billing Rate, Est. Monthly Billing, Est. Monthly Margin) pulling dynamically from Rate Card.",
                safeguards: [
                    "Verify Tier assignment matches Rate Card tiers (Tier 1, Tier 2, Tier 3) to prevent rate lookup errors.",
                    "Update candidate status immediately when placed with a client to keep bench capacity accurate."
                ],
                keywords: ["bench roster", "active bench", "vea pay rate", "client billing rate", "monthly billing", "margin", "placement"]
            },
            {
                id: "discovery-matcher",
                num: "07",
                title: "Live Discovery Call Matcher",
                badge: "121 Active Formulas",
                purpose: "Designed for live sales/discovery calls. Allows Account Managers to input real-time client preferences and instantly see the top 3 available candidate matches on screen.",
                steps: [
                    "Input live discovery parameters in top control cells (Tier Needed, Required Tools, Max Budget).",
                    "Read top match cards instantly generated in Rows 14–25.",
                    "Present candidate profile metrics (WPM, Practical Score, Availability) directly to client during the call."
                ],
                manualCells: "Top Filter Controls (Tier Selector, Tool Checklist, Hourly Budget limit).",
                autoCells: "Rows 14–25 (Dynamic ranking list, Tool match %, Availability Fit, Final Recommendation Rank).",
                safeguards: [
                    "Do not alter ranking formula thresholds during a live client call.",
                    "Reset filter controls back to default after call ends."
                ],
                keywords: ["discovery matcher", "live call", "sales matcher", "real-time match", "top 3 candidates", "client call"]
            },
            {
                id: "rate-card",
                num: "08",
                title: "Rate Card & Financial Model",
                badge: "27 Active Formulas",
                purpose: "Defines official pricing tiers, VEA pay floors, client hourly rates, markup logic (standard 80% markup), gross margins, and placement fee structures across Tier 1, Tier 2, and Tier 3.",
                steps: [
                    "Review pricing structures per Tier (Tier 1 Entry/Standard, Tier 2 Advanced, Tier 3 Executive/Specialized).",
                    "Modify base VEA pay floors only if approved by executive leadership.",
                    "Observe auto-calculated Client Billing Rates and Gross Margin percentages."
                ],
                manualCells: "Base VEA Pay Floors and Target Markup Percentages.",
                autoCells: "Columns C through G (Client Billing Rates, Hourly Margins, Margin %, Estimated Monthly Billing per VEA).",
                safeguards: [
                    "DO NOT manually edit Client Billing Rates; they are locked to auto-calculate based on base pay floor + target markup.",
                    "Changes made here immediately trickle down to Active Bench Roster and Matcher sheets."
                ],
                keywords: ["rate card", "financial model", "markup", "margin", "tier 1", "tier 2", "tier 3", "pay floor", "billing rate"]
            },
            {
                id: "screening-config",
                num: "09",
                title: "Screening Config",
                badge: "Answer Key & Thresholds",
                purpose: "Contains master grading answer keys, passing thresholds (e.g., minimum WPM = 50, minimum score = 80%), and regex patterns used by automated formulas on the Pipeline sheet.",
                steps: [
                    "Update correct answer options for Q1 through Q5 if screening quiz questions change.",
                    "Adjust minimum required typing WPM threshold if recruitment criteria shift."
                ],
                manualCells: "Answer Key values, Minimum Passing Score, Minimum WPM threshold.",
                autoCells: "None (Configuration Master Tab).",
                safeguards: [
                    "Ensure text formatting in answer keys matches candidate form choices letter-for-letter.",
                    "Never leave answer key cells blank; blank cells will cause all candidates to fail auto-grading."
                ],
                keywords: ["screening config", "answer key", "thresholds", "wpm threshold", "passing score", "q1 key", "q2 key", "regex"]
            },
            {
                id: "automation-config",
                num: "10",
                title: "Automation Config",
                badge: "Script Master Settings",
                purpose: "Central parameter store for the Google Apps Script engine. Stores DRY_RUN toggles, admin notification emails, Google Drive Folder IDs, and execution controls without requiring code edits.",
                steps: [
                    "Verify SENDER_EMAIL is set to active production workspace account (`stayout.solutions@gmail.com`).",
                    "Verify CANDIDATE_FOLDERS_PARENT_ID contains a valid Google Drive folder ID string.",
                    "Switch DRY_RUN parameter from `TRUE` to `FALSE` when ready for full live execution."
                ],
                manualCells: "All parameter values in Column C.",
                autoCells: "Status verification indicators.",
                safeguards: [
                    "CRITICAL: Keep DRY_RUN = TRUE during testing to prevent accidental automated email dispatch to candidates.",

                ],
                keywords: ["automation config", "dry_run", "dry run", "sender_email", "parent_id", "google drive folder", "apps script", "api key"]
            },
            {
                id: "email-templates",
                num: "11",
                title: "Email Templates",
                badge: "Dynamic Mail Bodies",
                purpose: "Stores standardized email bodies for auto-dispatches (Practical Assessment Invitation, Tier Qualification Notice, Rejection Notice, Interview Invite) complete with merge tags (`{{Name}}`, `{{ConnecteamLink}}`, `{{Tier}}`).",
                steps: [
                    "Select template to update (e.g., Practical Test Invite).",
                    "Edit text while keeping template placeholders (`{{Name}}`, `{{ConnecteamLink}}`, etc.) intact.",
                    "Test dispatch in DRY_RUN mode to inspect parsed output in execution logs."
                ],
                manualCells: "Template Subject lines and Template HTML/Text bodies.",
                autoCells: "None.",
                safeguards: [
                    "DO NOT edit or remove curly-brace placeholders like `{{Name}}`; the script relies on exact string replacement.",
                    "Avoid pasting formatted text with inline styling that breaks HTML email rendering."
                ],
                keywords: ["email templates", "templates", "placeholders", "merge tags", "practical invite", "rejection email", "interview invite"]
            },
            {
                id: "automation-log",
                num: "12",
                title: "Automation Log",
                badge: "Audit Trail",
                purpose: "Automated append-only audit trail logging every script execution, automated email dispatch, folder creation, status update, or error exception.",
                steps: [
                    "Review logs daily or when troubleshooting candidate notification issues.",
                    "Filter by status: 'SUCCESS', 'DRY_RUN_SKIP', or 'ERROR'.",
                    "Examine timestamps and target email addresses for compliance audits."
                ],
                manualCells: "None (Populated strictly by Google Apps Script).",
                autoCells: "All rows (Timestamp, Event Type, Target Candidate, Status, Details).",
                safeguards: [
                    "Do not manually delete or re-order log rows.",
                    "If errors occur, copy exact Error Message string when requesting technical support."
                ],
                keywords: ["automation log", "logs", "audit trail", "error log", "timestamps", "execution history", "dry_run_skip"]
            }
        ];

        let activeTabId = "overview";
        let searchQuery = "";

        window.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                const clearBtn = document.getElementById('clearSearchBtn');
                if (searchQuery.length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
                renderContent();
            });

            document.getElementById('clearSearchBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                searchQuery = '';
                document.getElementById('clearSearchBtn').classList.add('hidden');
                renderContent();
            });
        });

        function renderSidebar() {
            const container = document.getElementById("workbookTabNavs");
            container.innerHTML = workbookTabs.map(tab => {
                return `
                    <button onclick="setActiveTab('${tab.id}')" data-nav-id="${tab.id}" class="nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs transition-all text-slate-400 hover:text-slate-100 hover:bg-slate-800/60">
                        <div class="flex items-center space-x-2 truncate">
                            <span class="font-mono text-[10px] text-slate-500 font-bold">${tab.num}</span>
                            <span class="truncate">${tab.title}</span>
                        </div>
                    </button>
                `;
            }).join('');
        }

        function setActiveTab(id) {
            activeTabId = id;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const navId = btn.getAttribute('data-nav-id');
                if (navId === id) {
                    btn.className = "nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all bg-sky-500/20 text-sky-400 border border-sky-500/30";
                } else {
                    btn.className = "nav-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-100 hover:bg-slate-800/60";
                }
            });
            renderContent();
            document.getElementById('mainContent').scrollTop = 0;
        }

        function quickSearch(tag) {
            const input = document.getElementById('searchInput');
            input.value = tag;
            searchQuery = tag.toLowerCase();
            document.getElementById('clearSearchBtn').classList.remove('hidden');
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById("contentDisplay");

            if (searchQuery.length > 0) {
                renderSearchResults(container);
                return;
            }

            if (activeTabId === "overview") {
                renderOverview(container);
                return;
            }

            if (activeTabId === "go-live") {
                renderGoLive(container);
                return;
            }

            const tabData = workbookTabs.find(t => t.id === activeTabId);
            if (tabData) {
                renderTabDetail(container, tabData);
            }
        }

        function renderOverview(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-sky-950 via-slate-900 to-slate-900 border border-slate-800 p-6 lg:p-8 shadow-2xl">
                        <div class="space-y-3">
                            <span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold">
                                100% Native Google Workspace Engine
                            </span>
                            <h2 class="text-2xl lg:text-3xl font-extrabold text-white tracking-tight">
                                SOS VEA Recruitment Tracker Knowledge Base
                            </h2>
                            <p class="text-slate-300 text-xs lg:text-sm leading-relaxed max-w-3xl">
                                Welcome to the official operational manual for the SOS VEA Recruitment & Matching Tracker (v4.2). This application guides team members through data entry rules, formula safeguards, client bid matching, and pre-go-live audits.
                            </p>
                        </div>
                    </div>

                    <!-- Visual Cell Color Standards -->
                    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                            <span>Workbook Cell Color-Coding Standards</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1">
                                <div class="font-bold text-white flex items-center space-x-2">
                                    <span class="w-3 h-3 rounded bg-slate-800 border border-slate-600 inline-block"></span>
                                    <span>White / Dark Gray Cells</span>
                                </div>
                                <p class="text-slate-400 text-[11px]"><strong>Manual Entry:</strong> Safe to type candidate metadata, raw assessment links, or notes.</p>
                            </div>

                            <div class="bg-slate-950 p-4 rounded-xl border border-emerald-900/50 space-y-1">
                                <div class="font-bold text-emerald-400 flex items-center space-x-2">
                                    <span class="w-3 h-3 rounded bg-emerald-950 border border-emerald-500 inline-block"></span>
                                    <span>Soft Emerald / Green Cells</span>
                                </div>
                                <p class="text-slate-400 text-[11px]"><strong class="text-rose-400">DO NOT TOUCH:</strong> Contains automated formulas, regex scoring parsers, and tier gates.</p>
                            </div>

                            <div class="bg-slate-950 p-4 rounded-xl border border-sky-900/50 space-y-1">
                                <div class="font-bold text-sky-400 flex items-center space-x-2">
                                    <span class="w-3 h-3 rounded bg-sky-950 border border-sky-500 inline-block"></span>
                                    <span>Soft Blue / Purple Cells</span>
                                </div>
                                <p class="text-slate-400 text-[11px]"><strong>Account Manager Actions:</strong> Dropdowns for effective tier decisions and pipeline progression.</p>
                            </div>
                        </div>
                    </div>

        function renderSearchResults(container) {
            const matches = workbookTabs.filter(tab => {
                const text = `${tab.title} ${tab.purpose} ${tab.keywords.join(' ')} ${tab.steps.join(' ')} ${tab.manualCells} ${tab.autoCells}`.toLowerCase();
                return text.includes(searchQuery);
            });

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 space-y-3">
                        <h3 class="text-base font-bold text-slate-300">No documentation matched your query</h3>
                        <p class="text-xs text-slate-500">Try searching keywords like 'formulas', 'dry_run', 'connecteam', 'stalled', or 'practical'.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="border-b border-slate-800 pb-3">
                        <h2 class="text-lg font-bold text-white">Search Results</h2>
                        <p class="text-xs text-slate-400">Found ${matches.length} section(s) matching "<span class="text-amber-400">${searchQuery}</span>"</p>
                    </div>

                    <div class="space-y-3">
                        ${matches.map(tab => `
                            <div onclick="document.getElementById('searchInput').value=''; searchQuery=''; renderContent(); setActiveTab('${tab.id}');" class="bg-slate-900/80 border border-slate-800 hover:border-sky-500/50 rounded-2xl p-4 cursor-pointer transition-all space-y-2">
                                <div class="flex items-center justify-between">

                                    <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-mono">${tab.badge}</span>

                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
