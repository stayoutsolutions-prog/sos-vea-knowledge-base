<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS VEA Master Knowledge Base & Document Navigation Guide</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e'
            }
          }
        }
      }
    }
  </script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-full font-sans antialiased bg-slate-950 text-slate-100 flex flex-col custom-scrollbar overflow-x-hidden">

  <!-- Header -->
  <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-sky-500/20 border border-sky-500/40 flex items-center justify-center font-black text-sky-400 text-sm">
          SOS
        </div>
        <div>
          <h1 class="text-base font-bold text-white leading-tight">SOS VEA Program Master KB</h1>
          <p class="text-[11px] text-slate-400">v4.2 Operational Manual & Document Navigation Guide</p>
        </div>
      </div>

      <!-- Module Switcher Tabs -->
      <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-semibold">
        <button id="view-sheets-btn" onclick="switchMainView('sheets')" class="px-3 py-1.5 rounded-md text-white bg-sky-600 transition-all">
          📊 Workbook Reference (12 Tabs)
        </button>
        <button id="view-docs-btn" onclick="switchMainView('docs')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white transition-all">
          📁 Document & SOP Directory
        </button>
      </div>

      <!-- Quick Status Badge -->
      <div class="hidden md:flex items-center gap-2 text-xs">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Production Ready (v4.2)
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">

    <!-- Left Sidebar Navigation -->
    <aside class="w-full md:w-80 flex-shrink-0 flex flex-col gap-4">
      
      <!-- Search Input -->
      <div class="relative">
        <input 
          type="text" 
          id="search-input" 
          onkeyup="handleSearch()"
          placeholder="Search keywords (e.g. #formulas, SOW, Ethernet, Wise)..." 
          class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition"
        />
        <span class="absolute right-3 top-2.5 text-slate-500 text-xs">🔍</span>
      </div>

      <!-- Navigation List Container -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col gap-1 max-h-[calc(100vh-220px)] overflow-y-auto custom-scrollbar">
        <div id="nav-header" class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-3 py-1">
          Workbook Sheets (v4.2)
        </div>
        <div id="nav-items-container" class="flex flex-col gap-1">
          <!-- Dynamically Injected Nav Items -->
        </div>
      </div>
    </aside>

    <!-- Right Main Content Panel -->
    <main class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col min-h-[500px]">
      <div id="content-container" class="space-y-6">
        <!-- Dynamically Rendered Active View -->
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/50 py-4 text-center text-xs text-slate-500">
    Stay Out Solutions (SOS) VEA Program Master System Guide • Updated 2026
  </footer>

  <script>
    // System Data: Workbook Tabs & Document Directories
    const workbookData = [

        ],

      {

          "Review financial parameters across Tiers 1–3.",

        ],
        safeguards: "Client billing rates are locked to auto-calculate via `= VEA_Pay * (1 + 80%)`. Never type flat numbers over billing rate formulas.",
        keywords: ["rate card", "financial model", "markup", "margin", "placement fee", "billing rate"]
      },
      {
        id: "tab-09",
        num: "Tab 09",
        title: "Screening Config",
        badge: "Config",
        purpose: "Master configuration tab holding grading answer keys, passing thresholds, and regex parsing rules.",
        howTo: [
          "Update answer option keys for scenario questions Q1–Q5 if pre-screening form questions change."
        ],
        safeguards: "Text formatting in answer keys must match candidate form selections letter-for-letter. Blank key cells cause candidates to fail.",
        keywords: ["screening config", "answer keys", "regex", "thresholds"]
      },
      {
        id: "tab-10",
        num: "Tab 10",
        title: "Automation Config",
        badge: "Script Config",
        purpose: "Central parameter store for the Google Apps Script automation engine.",
        howTo: [
          "Update parameter values in Column C.",
          "Set SENDER_EMAIL to stayout.solutions@gmail.com.",
          "Confirm CANDIDATE_FOLDERS_PARENT_ID contains valid Drive folder ID.",
          "Toggle DRY_RUN from TRUE to FALSE when going live."
        ],
        safeguards: "Keep DRY_RUN = TRUE during testing to prevent accidental email dispatches.",
        keywords: ["automation config", "dry run", "folder id", "sender email", "apps script"]
      },
      {
        id: "tab-11",
        num: "Tab 11",
        title: "Email Templates",
        badge: "Templates",
        purpose: "Stores standardized email subject lines and HTML/text bodies for automated dispatches.",
        howTo: [
          "Edit subject lines or body text for dispatches."
        ],
        safeguards: "Never alter or remove curly-brace merge placeholders ({{Name}}, {{ConnecteamLink}}, {{MeetLink}}).",
        keywords: ["email templates", "merge tags", "placeholders", "dispatch"]
      },
      {
        id: "tab-12",
        num: "Tab 12",
        title: "Automation Log",
        badge: "Audit Trail",
        purpose: "Append-only audit trail automatically populated by Google Apps Script.",
        howTo: [
          "Inspect logs daily to verify script executions, email dispatches, folder creation events, or error exceptions."
        ],
        safeguards: "Do not manually delete or reorder log rows. Copy exact error message strings when requesting technical support.",
        keywords: ["automation log", "audit trail", "errors", "dispatches"]
      }
    ];

    const docDirectoryData = [
      {
        id: "doc-01",
        num: "DOC-01",
        title: "Master Document Navigation Directory",
        badge: "Matrix",
        purpose: "Interactive directory mapping all 20+ operational documents, templates, owners, and trigger stages across sales, vetting, contracting, and deployment.",
        keywords: ["documents", "templates", "matrix", "msa", "sow", "ica", "nda", "playbook"]
      },
      {
        id: "doc-02",
        num: "DOC-02",
        title: "5-Step Candidate Lifecycle & Vetting",
        badge: "SOP Vetting Rules",
        purpose: "Complete operational manual for candidate intake, Step 1 baseline gates, Step 2 Connecteam practical testing, Step 3 interview, 48h onboarding, and Tier 3 non-profit routing.",
        keywords: ["5-step", "vetting", "practical assessment", "connecteam", "interview", "tier 3", "non-profit", "wired ethernet"]
      },
      {
        id: "doc-03",
        num: "DOC-03",
        title: "Contracting, Financials & Rate Card",
        badge: "Financial Model",
        purpose: "Detailed pricing tiers ($4, $6-8, $8-10), 80% markup logic, $84.30 Placement Fee build-up, 6-month pay progression, and Wise biweekly payout mechanics.",
        keywords: ["rate card", "markup", "placement fee", "pay progression", "wise", "billing", "wave", "msa terms"]
      }
    ];

    let currentMainView = 'sheets'; // 'sheets' or 'docs'
    let activeItemId = 'tab-01';

    function switchMainView(view) {
      currentMainView = view;
      const sheetsBtn = document.getElementById('view-sheets-btn');
      const docsBtn = document.getElementById('view-docs-btn');
      const navHeader = document.getElementById('nav-header');

      if (view === 'sheets') {
        sheetsBtn.className = "px-3 py-1.5 rounded-md text-white bg-sky-600 transition-all";
        docsBtn.className = "px-3 py-1.5 rounded-md text-slate-400 hover:text-white transition-all";
        navHeader.innerText = "Workbook Sheets (v4.2)";
        activeItemId = 'tab-01';
      } else {
        docsBtn.className = "px-3 py-1.5 rounded-md text-white bg-sky-600 transition-all";
        sheetsBtn.className = "px-3 py-1.5 rounded-md text-slate-400 hover:text-white transition-all";
        navHeader.innerText = "Document Directory & SOPs";
        activeItemId = 'doc-01';
      }

      renderNavItems();
      renderContent();
    }

    function renderNavItems(filter = '') {
      const container = document.getElementById('nav-items-container');
      const items = currentMainView === 'sheets' ? workbookData : docDirectoryData;
      
      const filtered = items.filter(item => {
        const text = `${item.num} ${item.title} ${item.keywords.join(' ')}`.toLowerCase();
        return text.includes(filter.toLowerCase());
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-3 text-xs text-slate-500 italic">No matching topics found.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isActive = item.id === activeItemId;
        return `
          <button 
            onclick="selectItem('${item.id}')"
            class="w-full text-left px-3 py-2.5 rounded-xl transition-all flex items-center justify-between group ${
              isActive 
                ? 'bg-sky-600/20 border border-sky-500/40 text-white font-medium' 
                : 'hover:bg-slate-800/60 text-slate-400 hover:text-slate-200'
            }"
          >
            <div class="flex flex-col truncate">
              <span class="text-[10px] text-slate-500 group-hover:text-slate-400 uppercase tracking-wider">${item.num}</span>
              <span class="text-xs truncate font-semibold">${item.title}</span>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 border border-slate-700/50">${item.badge}</span>
          </button>
        `;
      }).join('');
    }

    function selectItem(id) {
      activeItemId = id;
      renderNavItems(document.getElementById('search-input').value);
      renderContent();
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value;
      renderNavItems(query);
    }

    function renderContent() {
      const container = document.getElementById('content-container');
      
      if (currentMainView === 'sheets') {
        const sheet = workbookData.find(s => s.id === activeItemId) || workbookData[0];
        container.innerHTML = `
          <div class="border-b border-slate-800 pb-4 flex items-center justify-between">
            <div>
              <span class="text-xs font-bold text-sky-400 uppercase tracking-wider">${sheet.num} Reference</span>
              <h2 class="text-2xl font-extrabold text-white mt-0.5">${sheet.title}</h2>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20">${sheet.badge}</span>
          </div>

          <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-4">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-1">Primary Purpose</h3>
            <p class="text-sm text-slate-200 leading-relaxed">${sheet.purpose}</p>
          </div>

          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">How to Utilize & Navigate</h3>
            <ul class="space-y-2">
              ${sheet.howTo.map(step => `
                <li class="flex items-start gap-2 text-xs text-slate-300">
                  <span class="text-sky-400 font-bold mt-0.5">•</span>
                  <span>${step}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4">
            <h3 class="text-xs font-bold text-amber-400 uppercase mb-1 flex items-center gap-1.5">
              <span>⚠️</span> Operational Safeguards & Formula Protection
            </h3>
            <p class="text-xs text-amber-200/90 leading-relaxed">${sheet.safeguards}</p>
          </div>
        `;
      } else {
        if (activeItemId === 'doc-01') {
          container.innerHTML = `
            <div class="border-b border-slate-800 pb-4">
              <span class="text-xs font-bold text-sky-400 uppercase tracking-wider">Directory</span>
              <h2 class="text-2xl font-extrabold text-white mt-0.5">Master Document Navigation Directory</h2>
              <p class="text-xs text-slate-400 mt-1">Cross-reference all 20+ operational templates and documents across every workflow phase.</p>
            </div>

            <div class="overflow-x-auto custom-scrollbar">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="bg-slate-950 text-sky-400 font-bold border-b border-slate-800">
                    <th class="p-2.5">Phase</th>
                    <th class="p-2.5">Document Title</th>
                    <th class="p-2.5">Owner</th>
                    <th class="p-2.5">Action / Purpose</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 text-slate-300">
                  <tr><td class="p-2.5 font-semibold text-slate-400">Sales Lead</td><td class="p-2.5 font-medium text-white">Client Intake Questionnaire</td><td class="p-2.5">Client</td><td class="p-2.5">Self-serve intake populates monday.com</td></tr>
                  <tr><td class="p-2.5 font-semibold text-slate-400">Discovery Call</td><td class="p-2.5 font-medium text-white">Discovery Call Playbook / Cheat Sheet</td><td class="p-2.5">Account Manager</td><td class="p-2.5">Guides 15m call, Core 5 questions, objections</td></tr>
                  <tr><td class="p-2.5 font-semibold text-slate-400">Client MSA</td><td class="p-2.5 font-medium text-white">Master Services Agreement (MSA)</td><td class="p-2.5">AM / Client</td><td class="p-2.5">Master legal contract, billing terms, non-circumvention</td></tr>
                  <tr><td class="p-2.5 font-semibold text-slate-400">Placement SOW</td><td class="p-2.5 font-medium text-white">Statement of Work (SOW)</td><td class="p-2.5">AM / Client</td><td class="p-2.5">Task scope, 10 hr/wk floor, 30-day term, $84.30 fee</td></tr>
                  <tr><td class="p-2.5 font-semibold text-slate-400">Contractor ICA</td><td class="p-2.5 font-medium text-white">Independent Contractor Agreement</td><td class="p-2.5">Candidate / SOS</td><td class="p-2.5">IC status, Ethernet mandate, Wise payouts</td></tr>
                  <tr><td class="p-2.5 font-semibold text-slate-400">Coaching</td><td class="p-2.5 font-medium text-white">Coaching & Escalation Log</td><td class="p-2.5">Account Manager</td><td class="p-2.5">Triggered 30-min unpaid coaching, performance checks</td></tr>
                </tbody>
              </table>
            </div>
          `;
        } else if (activeItemId === 'doc-02') {
          container.innerHTML = `
            <div class="border-b border-slate-800 pb-4">
              <span class="text-xs font-bold text-sky-400 uppercase tracking-wider">SOP Manual</span>
              <h2 class="text-2xl font-extrabold text-white mt-0.5">5-Step Candidate Lifecycle & Vetting Rules</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-5 gap-2 text-center text-xs">
              <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><div class="font-bold text-sky-400">STEP 1</div><div class="text-[11px] text-slate-300">Baseline Gate</div></div>
              <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><div class="font-bold text-sky-400">STEP 2</div><div class="text-[11px] text-slate-300">Practical Test</div></div>
              <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><div class="font-bold text-sky-400">STEP 3</div><div class="text-[11px] text-slate-300">Soft Skills Call</div></div>
              <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><div class="font-bold text-sky-400">STEP 4</div><div class="text-[11px] text-slate-300">48h Onboarding</div></div>
              <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><div class="font-bold text-sky-400">STEP 5</div><div class="text-[11px] text-slate-300">Bench Entry</div></div>
            </div>

            <div class="space-y-3 text-xs text-slate-300">
              <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <h4 class="font-bold text-white mb-1">Key Vetting Safeguards:</h4>
                <ul class="list-disc pl-4 space-y-1 text-slate-400">
                  <li><strong class="text-slate-200">Wired Ethernet Mandate:</strong> Wi-Fi is strictly prohibited as a primary connection. Physical Ethernet cable required.</li>
                  <li><strong class="text-slate-200">Scope Discipline Rule:</strong> Guessing or fixing errors without asking results in immediate test failure. Flagging & escalating is required.</li>
                  <li><strong class="text-slate-200">Tier 3 Exception:</strong> Tier 3 Non-Profit Specialists bypass Step 2 Connecteam practical testing because "they come in trained."</li>
                </ul>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="border-b border-slate-800 pb-4">
              <span class="text-xs font-bold text-sky-400 uppercase tracking-wider">Financial Model</span>
              <h2 class="text-2xl font-extrabold text-white mt-0.5">Rate Card, Financials & Payout Mechanics</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <h4 class="text-xs font-bold text-sky-400 uppercase">Tier 1 — General Admin</h4>
                <div class="text-2xl font-black text-white mt-1">$7.20 <span class="text-xs font-normal text-slate-400">/hr client</span></div>
                <div class="text-xs text-slate-400 mt-1">VEA Pay Floor: $4.00/hr</div>
                <div class="text-xs text-slate-500 mt-0.5">Markup: 80% ($3.20/hr margin)</div>
              </div>
              <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <h4 class="text-xs font-bold text-sky-400 uppercase">Tier 2 — Specialized</h4>
                <div class="text-2xl font-black text-white mt-1">$10.80 - $14.40 <span class="text-xs font-normal text-slate-400">/hr</span></div>
                <div class="text-xs text-slate-400 mt-1">VEA Pay Floor: $6.00 - $8.00/hr</div>
